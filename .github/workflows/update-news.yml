name: Update Market News

# Update news more frequently (every 2 hours during trading hours)
on:
  schedule:
    - cron: '0 4,6,8,10 * * 1-5'  # Mon-Fri: 9:30 AM, 11:30 AM, 1:30 PM, 3:30 PM IST
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: |
          cd scripts
          npm install
          
      - name: Fetch and convert RSS feeds to JSON
        run: node scripts/fetch-market-news.js
        
      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/market-news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update market news - $(date '+%Y-%m-%d %H:%M:%S')" && git push)
